{% extends 'base.html' %}

{% block title %}Ro'yxatdan o'tish - ProType{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
  <div class="text-center space-y-2">
    <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-600/30">
      <i data-lucide="user-plus" class="w-6 h-6"></i>
    </div>
    <h1 class="text-2xl font-black text-white">Ro'yxatdan O'tish</h1>
    <p class="text-xs text-slate-400">Yangi foydalanuvchi sifatida ro'yxatdan o'ting</p>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Login / Taxalluz</label>
      <input type="text" name="login" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Ism</label>
      <input type="text" name="ism" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Familiya</label>
      <input type="text" name="familiya" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Parol</label>
      <input type="password" name="password1" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-300 mb-1">Parolni tasdiqlang</label>
      <input type="password" name="password2" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>

    <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all">
      Hisob yaratish
    </button>
  </form>

  <div class="text-center text-xs text-slate-400">
    Allaqachon hisobingiz bormi? <a href="{% url 'accounts:login' %}" class="text-indigo-400 font-bold hover:underline">Kirish</a>
  </div>
</div>
{% endblock %}
